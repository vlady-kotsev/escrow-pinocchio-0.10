[package]
name = "escrow"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
debug = true
lto = "off"
opt-level = 0

[dependencies]
pinocchio = "0.10.2"
pinocchio-associated-token-account = "0.3.0"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.5.0"
pinocchio-token = "0.5.0"
wincode = { version = "0.4.4", features = ["derive"] }
solana-address = { version = "2.2.0", features = ["wincode", "copy"] }

[dev-dependencies]
mollusk-svm = { version = "0.10.2", features = ["register-tracing"] }
mollusk-svm-programs-token = "0.10.2"
solana-account = "3.4.0"
solana-program-option = "3.0.0"
spl-token-interface = "2.0.0"
solana-instruction = "3.1.0"
solana-rent = "4.0.0"
